services:
  # ── Banco de Dados ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nexusflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexusflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexusflow
    ports:
      - "5434:5432"
    volumes:
      - nexusflow_pgdata:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusflow -d nexusflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (Dart Frog) ─────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-nexusflow}/nexusflow-backend:latest
    container_name: nexusflow-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD}@db:5432/nexusflow?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  nexusflow_pgdata:
